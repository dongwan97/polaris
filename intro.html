<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polaris · Navigator</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard",
          sans-serif;
        color: #fff;
      }

      /* ─── Cosmic background ─── */
      .cosmos {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: radial-gradient(
            ellipse at 30% 20%,
            rgba(20, 15, 40, 0.5) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 75% 75%,
            rgba(10, 18, 45, 0.45) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse at 50% 50%,
            #060812 0%,
            #020308 70%,
            #000 100%
          );
      }

      /* Subtle galactic dust band — barely visible */
      .galactic-band {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(
          105deg,
          transparent 35%,
          rgba(40, 30, 70, 0.06) 45%,
          rgba(60, 45, 90, 0.08) 50%,
          rgba(40, 30, 70, 0.06) 55%,
          transparent 65%
        );
        pointer-events: none;
        mix-blend-mode: screen;
      }

      /* Stars */
      #starfield {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }
      .star {
        position: absolute;
        border-radius: 50%;
        background: #fff;
        animation: tw var(--dur, 4s) ease-in-out infinite;
        animation-delay: var(--delay, 0s);
      }
      @keyframes tw {
        0%,
        100% {
          opacity: var(--pk, 0.85);
        }
        50% {
          opacity: calc(var(--pk, 0.85) * 0.35);
        }
      }

      /* Distant deep-sky objects (faint colored stars) */
      .star.tinted-blue {
        background: #b4c8ff;
      }
      .star.tinted-warm {
        background: #ffd8b0;
      }
      .star.tinted-red {
        background: #ff9080;
      }

      /* ─── Header ─── */
      .ui-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        padding: 30px 48px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .ui-logo {
        font-size: 11px;
        letter-spacing: 0.45em;
        color: rgba(168, 180, 255, 0.5);
        text-transform: uppercase;
      }
      .ui-time {
        font-size: 10px;
        letter-spacing: 0.3em;
        color: rgba(255, 255, 255, 0.25);
        text-transform: uppercase;
        font-variant-numeric: tabular-nums;
      }

      /* ─── Center title (subtle) ─── */
      .stage-title {
        position: fixed;
        top: 38%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
        text-align: center;
        pointer-events: none;
      }
      .stage-title h1 {
        font-size: 13px;
        font-weight: 300;
        letter-spacing: 0.7em;
        text-indent: 0.7em;
        color: rgba(255, 255, 255, 0.35);
        text-transform: uppercase;
        margin: 0;
      }
      .stage-title p {
        font-size: 10px;
        letter-spacing: 0.3em;
        color: rgba(168, 180, 255, 0.3);
        margin-top: 14px;
        text-transform: uppercase;
      }

      /* ─── Icon dock (bottom center) ─── */
      .dock {
        position: fixed;
        bottom: 60px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        align-items: flex-end;
        gap: 64px;
        padding: 20px 40px;
      }
      /* faint horizon line behind the dock */
      .dock::before {
        content: "";
        position: absolute;
        left: -40px;
        right: -40px;
        bottom: 18px;
        height: 1px;
        background: linear-gradient(
          to right,
          transparent,
          rgba(168, 180, 255, 0.18) 30%,
          rgba(168, 180, 255, 0.18) 70%,
          transparent
        );
        pointer-events: none;
      }

      .icon-slot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        cursor: pointer;
        user-select: none;
        transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .icon-slot:hover {
        transform: translateY(-6px);
      }

      .icon-stage {
        width: 72px;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        transition: filter 0.35s ease;
      }
      .icon-slot:hover .icon-stage {
        filter: brightness(1.2);
      }

      .icon-meta {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        transition: opacity 0.35s ease;
        opacity: 0.55;
      }
      .icon-slot:hover .icon-meta {
        opacity: 1;
      }

      .icon-name {
        font-size: 11px;
        letter-spacing: 0.18em;
        color: rgba(255, 255, 255, 0.85);
      }
      .icon-en {
        font-size: 8.5px;
        letter-spacing: 0.32em;
        color: rgba(168, 180, 255, 0.5);
        text-transform: uppercase;
      }

      /* selection underline */
      .icon-slot::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -8px;
        width: 0;
        height: 1px;
        background: rgba(168, 180, 255, 0.7);
        transform: translateX(-50%);
        transition: width 0.35s ease;
      }
      .icon-slot:hover::after {
        width: 28px;
      }

      /* ═══════════════════════════════
       BLACK HOLE icon
    ═══════════════════════════════ */
      .ico-bh {
        position: relative;
        width: 64px;
        height: 64px;
      }
      .ico-bh-disk {
        position: absolute;
        width: 64px;
        height: 18px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotateX(72deg);
        border-radius: 50%;
        background: conic-gradient(
          from 180deg,
          rgba(255, 210, 90, 0) 0deg,
          rgba(255, 150, 30, 0.65) 25deg,
          rgba(255, 225, 110, 0.95) 50deg,
          rgba(255, 160, 45, 0.85) 75deg,
          rgba(210, 75, 10, 0.55) 110deg,
          rgba(60, 18, 0, 0.15) 150deg,
          rgba(0, 0, 0, 0) 180deg,
          rgba(60, 18, 0, 0.2) 210deg,
          rgba(170, 55, 10, 0.55) 255deg,
          rgba(255, 150, 30, 0.75) 300deg,
          rgba(255, 210, 90, 0.4) 340deg,
          rgba(255, 210, 90, 0) 360deg
        );
        filter: blur(1.5px);
        animation: bh-spin 14s linear infinite;
      }
      @keyframes bh-spin {
        from {
          transform: translate(-50%, -50%) rotateX(72deg) rotateZ(0deg);
        }
        to {
          transform: translate(-50%, -50%) rotateX(72deg) rotateZ(360deg);
        }
      }
      .ico-bh-core {
        position: absolute;
        width: 32px;
        height: 32px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          #000 70%,
          #0a0204 88%,
          transparent 100%
        );
        box-shadow: 0 0 0 1.5px rgba(255, 150, 40, 0.3),
          0 0 8px 3px rgba(255, 90, 15, 0.2), inset 0 0 12px rgba(0, 0, 0, 1);
        z-index: 2;
      }
      .ico-bh-ring {
        position: absolute;
        width: 40px;
        height: 40px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1px solid rgba(255, 170, 55, 0.45);
        box-shadow: 0 0 6px 2px rgba(255, 130, 25, 0.2),
          inset 0 0 4px rgba(255, 130, 25, 0.08);
        z-index: 3;
      }

      /* ═══════════════════════════════
       POLARIS icon
    ═══════════════════════════════ */
      .ico-pol {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ico-pol-core {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 5px 2px #fff, 0 0 14px 5px rgba(168, 180, 255, 0.9),
          0 0 30px 10px rgba(168, 180, 255, 0.4),
          0 0 55px 18px rgba(120, 140, 255, 0.18);
        animation: pol-pulse 3s ease-in-out infinite;
      }
      @keyframes pol-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.18);
          opacity: 0.85;
        }
      }
      .pol-r {
        position: absolute;
        transform-origin: center;
      }
      .pol-r.v {
        width: 1.2px;
        height: 52px;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(255, 255, 255, 0.85),
          transparent
        );
      }
      .pol-r.h {
        width: 52px;
        height: 1.2px;
        background: linear-gradient(
          to right,
          transparent,
          rgba(255, 255, 255, 0.85),
          transparent
        );
      }
      .pol-r.d1 {
        width: 0.8px;
        height: 36px;
        transform: rotate(45deg);
        opacity: 0.45;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(255, 255, 255, 0.7),
          transparent
        );
      }
      .pol-r.d2 {
        width: 0.8px;
        height: 36px;
        transform: rotate(-45deg);
        opacity: 0.45;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(255, 255, 255, 0.7),
          transparent
        );
      }

      /* ═══════════════════════════════
       EARTH icon
    ═══════════════════════════════ */
      .ico-earth {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        position: relative;
        background: radial-gradient(
            circle at 32% 28%,
            rgba(255, 255, 255, 0.12) 0%,
            transparent 45%
          ),
          radial-gradient(
            circle at 50% 50%,
            rgba(35, 110, 210, 0.85) 0%,
            rgba(12, 65, 165, 0.92) 38%,
            rgba(4, 30, 90, 0.96) 68%,
            #000a18 100%
          );
        box-shadow: 0 0 0 1px rgba(100, 180, 255, 0.18),
          0 0 14px 4px rgba(45, 115, 255, 0.18),
          0 0 40px 10px rgba(25, 75, 200, 0.08),
          inset -14px -7px 26px rgba(0, 0, 55, 0.65);
      }
      .ico-earth::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
            ellipse 13px 8px at 28% 38%,
            rgba(40, 165, 45, 0.55) 0%,
            transparent 100%
          ),
          radial-gradient(
            ellipse 8px 6px at 52% 34%,
            rgba(55, 175, 55, 0.45) 0%,
            transparent 100%
          ),
          radial-gradient(
            ellipse 7px 11px at 72% 54%,
            rgba(42, 155, 44, 0.45) 0%,
            transparent 100%
          ),
          radial-gradient(
            ellipse 6px 5px at 22% 64%,
            rgba(210, 170, 80, 0.35) 0%,
            transparent 100%
          );
      }
      .ico-earth-atm {
        position: absolute;
        width: 70px;
        height: 70px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          transparent 38%,
          rgba(75, 145, 255, 0.12) 45%,
          rgba(75, 145, 255, 0.05) 55%,
          transparent 65%
        );
        pointer-events: none;
      }

      /* ═══════════════════════════════
       NEPTUNE icon
    ═══════════════════════════════ */
      .ico-nep {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        position: relative;
        background: radial-gradient(
            circle at 34% 28%,
            rgba(255, 255, 255, 0.09) 0%,
            transparent 38%
          ),
          radial-gradient(
            circle at 50% 50%,
            rgba(35, 85, 210, 0.75) 0%,
            rgba(12, 45, 165, 0.88) 38%,
            rgba(5, 22, 105, 0.95) 68%,
            #000510 100%
          );
        box-shadow: 0 0 0 1px rgba(80, 130, 255, 0.18),
          0 0 16px 5px rgba(30, 78, 205, 0.22),
          0 0 40px 12px rgba(10, 40, 155, 0.08),
          inset -10px -6px 22px rgba(0, 0, 55, 0.7);
      }
      .ico-nep::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: linear-gradient(
          180deg,
          transparent 14%,
          rgba(65, 125, 255, 0.13) 26%,
          transparent 32%,
          rgba(45, 105, 225, 0.1) 46%,
          transparent 53%,
          rgba(65, 135, 255, 0.08) 64%,
          transparent 71%
        );
      }
      .ico-nep-atm {
        position: absolute;
        width: 66px;
        height: 66px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          transparent 37%,
          rgba(50, 100, 255, 0.13) 43%,
          rgba(50, 100, 255, 0.05) 53%,
          transparent 63%
        );
        pointer-events: none;
      }
      .ico-nep-ring {
        position: absolute;
        width: 78px;
        height: 16px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotateX(76deg);
        border-radius: 50%;
        border: 1px solid rgba(80, 130, 255, 0.18);
        pointer-events: none;
      }

      /* ─── Page transition ─── */
      #overlay {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.55s ease;
        z-index: 50;
      }
      #overlay.on {
        opacity: 1;
        pointer-events: all;
      }

      /* ─── Toast ─── */
      .toast {
        position: fixed;
        bottom: 200px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.13);
        padding: 9px 26px;
        border-radius: 22px;
        font-size: 11px;
        letter-spacing: 0.25em;
        color: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(10px);
        z-index: 60;
        animation: toast-fade 2.2s ease forwards;
      }
      @keyframes toast-fade {
        0% {
          opacity: 0;
          transform: translateX(-50%) translateY(8px);
        }
        18% {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
        75% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="cosmos"></div>
    <div class="galactic-band"></div>
    <div id="starfield"></div>

    <header class="ui-header">
      <span class="ui-logo">Polaris · Navigator</span>
      <span class="ui-time" id="ui-time">—</span>
    </header>

    <div class="stage-title">
      <h1>Choose Your Destination</h1>
      <p>네 개의 좌표 — 하나의 항해</p>
    </div>

    <!-- ─── Icon Dock ─── -->
    <div class="dock">
      <!-- 특이점 -->
      <div class="icon-slot" onclick="go('singularity')">
        <div class="icon-stage">
          <div class="ico-bh">
            <div class="ico-bh-disk"></div>
            <div class="ico-bh-core"></div>
            <div class="ico-bh-ring"></div>
          </div>
        </div>
        <div class="icon-meta">
          <span class="icon-name">특이점</span>
          <span class="icon-en">Singularity</span>
        </div>
      </div>

      <!-- 해왕성 -->
      <div class="icon-slot" onclick="go('neptune')">
        <div class="icon-stage">
          <div style="position: relative">
            <div class="ico-nep"></div>
            <div class="ico-nep-atm"></div>
            <div class="ico-nep-ring"></div>
          </div>
        </div>
        <div class="icon-meta">
          <span class="icon-name">해왕성</span>
          <span class="icon-en">Neptune</span>
        </div>
      </div>

      <!-- 지구 -->
      <div class="icon-slot" onclick="go('earth')">
        <div class="icon-stage">
          <div style="position: relative">
            <div class="ico-earth"></div>
            <div class="ico-earth-atm"></div>
          </div>
        </div>
        <div class="icon-meta">
          <span class="icon-name">지구</span>
          <span class="icon-en">Earth</span>
        </div>
      </div>

      <!-- 북극성 -->
      <div class="icon-slot" onclick="go('polaris')">
        <div class="icon-stage">
          <div class="ico-pol">
            <div class="pol-r v"></div>
            <div class="pol-r h"></div>
            <div class="pol-r d1"></div>
            <div class="pol-r d2"></div>
            <div class="ico-pol-core"></div>
          </div>
        </div>
        <div class="icon-meta">
          <span class="icon-name">북극성</span>
          <span class="icon-en">Polaris</span>
        </div>
      </div>
    </div>

    <div id="overlay"></div>

    <script>
      /* ─── Realistic starfield ─── */
      (function () {
        const sf = document.getElementById("starfield");
        const frag = document.createDocumentFragment();

        // Tier 1 — distant tiny dim stars (most numerous)
        for (let i = 0; i < 380; i++) {
          const el = document.createElement("div");
          const size = 0.4 + Math.random() * 0.8;
          const peak = 0.2 + Math.random() * 0.35;
          el.className = "star";
          // 5% tinted
          const tintRoll = Math.random();
          if (tintRoll < 0.04) el.classList.add("tinted-blue");
          else if (tintRoll < 0.06) el.classList.add("tinted-warm");
          el.style.cssText = `
          left:${(Math.random() * 100).toFixed(2)}%;
          top:${(Math.random() * 100).toFixed(2)}%;
          width:${size.toFixed(2)}px; height:${size.toFixed(2)}px;
          --pk:${peak.toFixed(2)};
          --dur:${(3.5 + Math.random() * 7).toFixed(1)}s;
          --delay:${(Math.random() * 8).toFixed(1)}s;
        `;
          frag.appendChild(el);
        }

        // Tier 2 — mid stars with subtle glow
        for (let i = 0; i < 130; i++) {
          const el = document.createElement("div");
          const size = 0.9 + Math.random() * 1.2;
          const peak = 0.45 + Math.random() * 0.35;
          el.className = "star";
          const tintRoll = Math.random();
          if (tintRoll < 0.1) el.classList.add("tinted-blue");
          else if (tintRoll < 0.14) el.classList.add("tinted-warm");
          else if (tintRoll < 0.16) el.classList.add("tinted-red");
          el.style.cssText = `
          left:${(Math.random() * 100).toFixed(2)}%;
          top:${(Math.random() * 100).toFixed(2)}%;
          width:${size.toFixed(2)}px; height:${size.toFixed(2)}px;
          --pk:${peak.toFixed(2)};
          --dur:${(3 + Math.random() * 6).toFixed(1)}s;
          --delay:${(Math.random() * 8).toFixed(1)}s;
          box-shadow: 0 0 ${(size * 1.5).toFixed(1)}px rgba(255,255,255,0.4);
        `;
          frag.appendChild(el);
        }

        // Tier 3 — bright signature stars
        for (let i = 0; i < 32; i++) {
          const el = document.createElement("div");
          const size = 1.6 + Math.random() * 1.4;
          const peak = 0.75 + Math.random() * 0.22;
          el.className = "star";
          const tintRoll = Math.random();
          let glowColor = "rgba(255,255,255,0.9)";
          if (tintRoll < 0.18) {
            el.classList.add("tinted-blue");
            glowColor = "rgba(180,200,255,0.85)";
          } else if (tintRoll < 0.3) {
            el.classList.add("tinted-warm");
            glowColor = "rgba(255,220,180,0.85)";
          }
          el.style.cssText = `
          left:${(Math.random() * 100).toFixed(2)}%;
          top:${(Math.random() * 100).toFixed(2)}%;
          width:${size.toFixed(2)}px; height:${size.toFixed(2)}px;
          --pk:${peak.toFixed(2)};
          --dur:${(2.5 + Math.random() * 4).toFixed(1)}s;
          --delay:${(Math.random() * 6).toFixed(1)}s;
          box-shadow: 0 0 ${(size * 3).toFixed(1)}px ${glowColor};
        `;
          frag.appendChild(el);
        }

        sf.appendChild(frag);
      })();

      /* ─── Live clock (header) ─── */
      function updateClock() {
        const d = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        document.getElementById(
          "ui-time"
        ).textContent = `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(
          d.getDate()
        )} · ${pad(d.getHours())}:${pad(d.getMinutes())} KST`;
      }
      updateClock();
      setInterval(updateClock, 30000);

      /* ─── Navigation ─── */
      const DEST = {
        polaris: "index.html",
        singularity: null,
        earth: null,
        neptune: null,
      };

      function go(key) {
        const url = DEST[key];
        const overlay = document.getElementById("overlay");
        overlay.classList.add("on");
        setTimeout(() => {
          if (url) window.location.href = url;
          else {
            overlay.classList.remove("on");
            toast("준비 중입니다");
          }
        }, 520);
      }

      function toast(msg) {
        const el = document.createElement("div");
        el.className = "toast";
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2300);
      }
    </script>
  </body>
</html>
